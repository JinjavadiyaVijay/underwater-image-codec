[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uwcodec"
version = "0.1.0"
description = "Object-Centric Structured-Semantic Codec for ultra-low-bitrate underwater image transmission"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "FishVision-AI"},
]

dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0",
    "omegaconf>=2.3.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
detection = [
    "ultralytics>=8.1.0",
]
metrics = [
    "lpips>=0.1.4",
    "pytorch-msssim>=1.0.0",
]
baselines = [
    "compressai>=1.2.0",
]
teacher = [
    "open_clip_torch>=2.24.0",
    "transformers>=4.36.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
all = [
    "uwcodec[detection,metrics,baselines,teacher,dev]",
]

# Console scripts removed — use module execution instead:
#   python -m uwcodec.training.train_v2 ...
#   python scripts/eval_v2.py ...

[tool.setuptools.packages.find]
include = ["uwcodec*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
